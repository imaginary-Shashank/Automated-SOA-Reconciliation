name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit openpyxl pydantic pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "app.py;." --add-data "excel_ops.py;." --add-data "matcher.py;." --add-data "schemas.py;." --copy-metadata streamlit run_app.py

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: SOA_Reconciler_Beta_Windows
        path: dist/run_app